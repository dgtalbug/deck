[define]
DECK_FEATURE_GROOMING = "true"
DECK_FEATURE_SSE = "true"
DECK_FEATURE_TWEAK = "true"

[test]
# Discovery stays inside tests/ — vendored skill collections under .agents/
# and agent/ carry example tests that must not join deck's suite.
root = "./tests"
preload = ["./tests/setup.ts"]
# Coverage is gate evidence, not a tax on every local run — request it
# explicitly with `bun test --coverage` (bun run test:full).
